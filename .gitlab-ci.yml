workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - docker

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: .cache/pip

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

lint:
  stage: check
  before_script:
    - pip install -r requirements.txt
  script:
    - ruff check .

unit-tests:
  stage: check
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest --cov=app --cov-report=xml:coverage.xml --cov-fail-under=80
  coverage: '/^TOTAL.*?(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docker-build:
  stage: docker
  image: docker:28
  services:
    - docker:28-dind
  script:
    - docker build -t apartment-booking:ci .
    - docker volume create booking-ci-data
    - docker run --rm -v booking-ci-data:/data apartment-booking:ci
      apartment add --name Test --address Main
    - docker run --rm -v booking-ci-data:/data apartment-booking:ci
      apartment list | grep "Test"
    - docker volume rm booking-ci-data
