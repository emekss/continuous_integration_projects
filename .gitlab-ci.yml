workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - docker

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: .cache/pip

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

lint:
  stage: check
  before_script:
    - pip install -r requirements.txt
  script:
    - ruff check .

unit-tests:
  stage: check
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest --cov=app --cov-report=xml:coverage.xml --cov-fail-under=80
  coverage: '/^TOTAL.*?(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docker-build:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --no-push
      --verbosity info
