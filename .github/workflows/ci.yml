name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest --cov=app --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker volume create booking-data
          docker compose up -d --build
      - name: Smoke test through the nginx gateway
        run: |
          for i in $(seq 1 45); do
            curl -sf http://localhost:8080/api/health > /dev/null && break
            sleep 1
          done
          curl -sf -c cookies.txt -X POST -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"password123"}' \
            http://localhost:8080/api/auth/register
          curl -sf -b cookies.txt -X POST -H 'Content-Type: application/json' \
            -d '{"name":"Test","address":"Main"}' \
            http://localhost:8080/api/apartments
          curl -sf -b cookies.txt http://localhost:8080/api/apartments \
            | grep -q "Test"
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8080/api/apartments)" = "401"
          for i in $(seq 1 15); do
            docker compose logs consumer | grep -q "apartment_added" && break
            sleep 1
          done
          docker compose logs consumer | grep -q "apartment_added"
          curl -sf http://localhost:8080/ | grep -qi "<div id=\"root\">"
      - name: Tear down compose stack
        if: always()
        run: docker compose down && docker volume rm booking-data

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push versioned image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build -t "$image" .
          docker push "$image"
