name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m pytest --cov=app --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apartment-booking:ci .
      - name: Smoke test web server on port 8000
        run: |
          docker volume create booking-ci-data
          docker run -d --name booking-app -p 8000:8000 \
            -v booking-ci-data:/data apartment-booking:ci
          trap 'docker rm -f booking-app; docker volume rm booking-ci-data' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null && break
            sleep 1
          done
          curl -sf -d 'name=Test&address=Main' http://localhost:8000/apartments \
            -o /dev/null
          curl -sf http://localhost:8000/ | grep -q "Test"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push versioned image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build -t "$image" .
          docker push "$image"
